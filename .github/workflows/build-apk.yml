name: Build Android APK

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Flutter host project
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name pdf_stamp_mvp .
          fi
      
      - name: Align Android SDK levels for plugin compatibility
        run: |
          # Ensure Flutter-wide SDK overrides so app + plugin modules use API 36.
          mkdir -p android
          touch android/gradle.properties
          grep -q '^flutter.compileSdkVersion=' android/gradle.properties && \
            sed -i 's/^flutter.compileSdkVersion=.*/flutter.compileSdkVersion=36/' android/gradle.properties || \
            echo 'flutter.compileSdkVersion=36' >> android/gradle.properties
          grep -q '^flutter.targetSdkVersion=' android/gradle.properties && \
            sed -i 's/^flutter.targetSdkVersion=.*/flutter.targetSdkVersion=36/' android/gradle.properties || \
            echo 'flutter.targetSdkVersion=36' >> android/gradle.properties

          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/g' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 36/g' android/app/build.gradle
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Force plugin compileSdk to 36 in CI
        run: |
          # Some plugin modules may still resolve to android-34 despite app-level overrides.
          # Rewrite compile/target SDK directives across Gradle scripts in workspace and pub cache.
          mapfile -d '' gradle_files < <(find . "$HOME/.pub-cache" -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print0)
          for f in "${gradle_files[@]}"; do
            sed -i 's/compileSdk[[:space:]]*=[[:space:]]*flutter\.compileSdkVersion/compileSdk = 36/g' "$f" || true
            sed -i 's/targetSdk[[:space:]]*=[[:space:]]*flutter\.targetSdkVersion/targetSdk = 36/g' "$f" || true
            sed -i 's/compileSdkVersion[[:space:]]*flutter\.compileSdkVersion/compileSdkVersion 36/g' "$f" || true
            sed -i 's/targetSdkVersion[[:space:]]*flutter\.targetSdkVersion/targetSdkVersion 36/g' "$f" || true
            sed -i 's/compileSdkVersion[[:space:]]*34/compileSdkVersion 36/g' "$f" || true
            sed -i 's/targetSdkVersion[[:space:]]*34/targetSdkVersion 36/g' "$f" || true
            sed -i 's/compileSdk[[:space:]]*=[[:space:]]*34/compileSdk = 36/g' "$f" || true
            sed -i 's/targetSdk[[:space:]]*=[[:space:]]*34/targetSdk = 36/g' "$f" || true
            sed -i "s/safeExtGet([^,]*,[[:space:]]*34)/safeExtGet('compileSdkVersion', 36)/g" "$f" || true
            sed -i "s/safeExtGet([^,]*,[[:space:]]*35)/safeExtGet('compileSdkVersion', 36)/g" "$f" || true
            sed -i "s/safeExtGet('targetSdkVersion',[[:space:]]*34)/safeExtGet('targetSdkVersion', 36)/g" "$f" || true
            sed -i "s/safeExtGet('targetSdkVersion',[[:space:]]*35)/safeExtGet('targetSdkVersion', 36)/g" "$f" || true
          done
          echo "Patched ${#gradle_files[@]} Gradle files"
          echo "Verifying file_picker Android SDK lines after patch:"
          find "$HOME/.pub-cache" -type f -path "*file_picker*/android/build.gradle*" -print -exec sh -c "echo '---'; grep -nE 'compileSdk|targetSdk|safeExtGet' \"\$1\" || true" _ {} \;

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
